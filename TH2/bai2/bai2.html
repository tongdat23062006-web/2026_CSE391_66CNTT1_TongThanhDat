<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@700&family=Oleo+Script:wght@700&family=Quicksand:wght@300;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./static/shared.css" />
    <link rel="stylesheet" href="./static/style.css" />
    <title>Travel Goals</title>
  </head>
  <body>
    <div id="background">
      <header>
        <div id="page-logo">
          <a class="page-logo" href="./index.html">Travel Goals</a>
        </div>
        <nav class="nav">
          <ul class="nav__list">
            <li class="nav__items"><a class="nav__items" href="">Destinations</a></li>
            <li class="nav__items"><a class="nav__items" href="">About</a></li>
          </ul>
        </nav>
      </header>
      <main>
        <section id="hero">
          <div id="hero-content">
            <h1>Joe's Travel Page</h1>
            <p>Let's explore the world together!</p>
            <a class="hero__btn" href="">Discover places</a>
          </div>
        </section>
        <section id="highlights">
        <h2 class="highlights__text">HIGHLIGHTS</h2>
        <ul id="destinations">
          <li class="destination">
            <img
              src="images/places/miami.jpg"
              alt="Miami streets on sunny day"
            />
            <p>Miami <strong>USA</strong></p>
          </li>
          <li class="destination">
            <img
              src="images/places/munich.jpg"
              alt="Munich stadium in winter"
            />
            <p>Munich <strong>Germany</strong></p>
          </li>
          <li class="destination">
            <img
              src="images/places/barcelona.jpg"
              alt="Palm beach in Barcelona"
            />
            <p>Barcelona <strong>Spain</strong></p>
          </li>
        </ul>
        </section>
      </main>
    </div>
    <footer>
      <ul class="footer__list">
        <li>
          <a href="https://www.instagram.com">
            <img class="icon" src="images/icons/insta.png" alt="Instagram logo"/>
          </a>
        </li>
        <li>
          <a href="https://www.facebook.com">
            <img class="icon" src="images/icons/facebook.png" alt="Facebook logo"/>
          </a>
        </li>
      </ul>
    </footer>
  </body>
</html>
